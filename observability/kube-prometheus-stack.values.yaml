# Shared kube-prometheus-stack values: used by Terraform (local and EKS) and by CI.

# Pick up ServiceMonitors and PrometheusRules from every namespace, not only the ones
# labelled with this Helm release. Teams own their monitoring next to their manifests.
prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: page
      group_by: ["alertname", "job"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: page
          matchers: ['severity="page"']
          repeat_interval: 1h
        - receiver: ticket
          matchers: ['severity="ticket"']
          repeat_interval: 12h
        # Everything else (kube-prometheus-stack's own alerts, Watchdog) is dropped here.
        - receiver: "null"
          matchers: ['alertname=~".+"']
    receivers:
      # Locally and in CI both receivers deliver to alert-sink (k8s/alert-sink), which
      # records every notification so the e2e test can prove delivery.
      # For production swap in the real thing, for example:
      #   - name: page
      #     pagerduty_configs:
      #       - routing_key_file: /etc/alertmanager/secrets/pagerduty/routing-key
      #         severity: critical
      #   - name: ticket
      #     slack_configs:
      #       - api_url_file: /etc/alertmanager/secrets/slack/webhook
      #         channel: "#orders-reliability"
      - name: page
        webhook_configs:
          - url: http://alert-sink.monitoring.svc:8080/alerts?severity=page
            send_resolved: true
      - name: ticket
        webhook_configs:
          - url: http://alert-sink.monitoring.svc:8080/alerts?severity=ticket
            send_resolved: true
      - name: "null"

grafana:
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

# kind and EKS do not expose these control plane components for scraping,
# so disable them rather than living with permanently firing TargetDown alerts.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
