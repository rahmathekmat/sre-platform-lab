  <text x="24" y="44" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e6edf7">Why burn-rate alerts: a 20 minute incident at 10% errors</text>
  <line x1="90" x2="116" y1="84" y2="84" stroke="#2dd4bf" stroke-width="3"/><text x="124" y="89" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#8b9bb4">5m error ratio</text><line x1="250.8" x2="276.8" y1="84" y2="84" stroke="#60a5fa" stroke-width="3"/><text x="284.8" y="89" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#8b9bb4">1h error ratio</text><line x1="411.6" x2="437.6" y1="84" y2="84" stroke="#f87171" stroke-width="3" stroke-dasharray="6 5"/><text x="445.6" y="89" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#8b9bb4">page threshold (14.4 × 0.1%)</text>
  <rect x="357.5" y="110" width="178.3" height="380" fill="#f87171" fill-opacity="0.07"/>
  <text x="446.7" y="128" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#f87171">errors injected</text>
  <rect x="411.0" y="524" width="160.5" height="16" rx="4" fill="#f87171" fill-opacity="0.85"/>
  <text x="401.0" y="537" text-anchor="end" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f87171">page firing</text>
  <text x="90" y="570" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e6edf7">The page fires at minute 36 and clears at minute 54. It needs BOTH windows over the threshold:</text>
  <text x="90" y="590" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b9bb4">the 1h window stops short blips from paging, and the 5m window clears the page within minutes of recovery.</text>
