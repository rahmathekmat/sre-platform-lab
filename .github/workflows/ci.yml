name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - run: make test

  rules:
    name: alert rules (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Install promtool
        run: |
          mkdir -p "$HOME/bin" && echo "$HOME/bin" >> "$GITHUB_PATH"
          v=$(make -s print-PROMETHEUS_VERSION)
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${v}/prometheus-${v}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/bin" "prometheus-${v}.linux-amd64/promtool"
      - run: make test-rules

  manifests:
    name: manifests (kustomize + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Install kubeconform
        run: |
          mkdir -p "$HOME/bin" && echo "$HOME/bin" >> "$GITHUB_PATH"
          v=$(make -s print-KUBECONFORM_VERSION)
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${v}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/bin" kubeconform
      - run: make lint-k8s

  terraform:
    name: terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - run: make tf-check

  security:
    name: security (trivy image + config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install trivy
        run: |
          mkdir -p "$HOME/bin" && echo "$HOME/bin" >> "$GITHUB_PATH"
          v=$(make -s print-TRIVY_VERSION)
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/bin" "v${v}"
      - name: Build image
        run: docker build -t orders-api:local app
      - run: make scan-image
      - run: make scan-config

  e2e:
    name: e2e on kind (deploy + game day)
    needs: [app, rules, manifests, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: sre-lab
      - name: Install kube-prometheus-stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --version "$(make -s print-KPS_CHART_VERSION)" \
            --namespace monitoring --create-namespace \
            -f observability/kube-prometheus-stack.values.yaml \
            --set grafana.adminPassword=ci-only \
            --wait --timeout 10m
      - name: Build and load image
        run: make build
      - name: Deploy
        run: make deploy load
      - name: End to end checks
        run: make e2e
      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n orders describe deployment/orders-api
          kubectl -n orders logs deployment/orders-api --tail=50 || true
          kubectl -n orders get events --sort-by=.lastTimestamp | tail -30
